name: API artifact S0 security baseline

on:
  pull_request:
    paths:
      - "src/fetchcore/repository/api_artifact_policy.py"
      - "src/fetchcore/repository/safe_scan.py"
      - "src/fetchcore/application/service.py"
      - "src/fetchcore/repository/index_fingerprint.py"
      - "tests/unit/repository/test_api_artifact_s0.py"
      - "benchmarks/api-extraction-s0/**"
      - ".github/workflows/api-artifact-s0.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  before-after:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install benchmark dependencies
        run: python -m pip install -e ".[dev]"
      - name: Capture fixed pre-S0 corpus behavior
        run: |
          git worktree add /tmp/fetchcore-pre-s0 ef57d6b8f9fc49e465e7a26f26d1c151e527316b
          mkdir -p benchmark-output
          python benchmarks/api-extraction-s0/run.py --implementation-root /tmp/fetchcore-pre-s0 --repeats 5 > benchmark-output/before.json
      - name: Capture S0 corpus behavior
        run: |
          python benchmarks/api-extraction-s0/run.py --implementation-root . --repeats 5 > benchmark-output/after.json
      - name: Verify safe output and baseline identity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          before = json.loads(Path("benchmark-output/before.json").read_text())
          after = json.loads(Path("benchmark-output/after.json").read_text())
          assert before["fixture_fingerprint"] == after["fixture_fingerprint"]
          assert before["indexing_fingerprint"] != after["indexing_fingerprint"]
          assert before["secret_in_canonical"] is True
          assert after["secret_in_canonical"] is False
          assert all(not row["secret_in_results"] for row in after["queries"])
          assert all(row["blocked"] and not row["secret_exposed"] for row in after["source_access"])
          assert after["scan"]["skipped"]["api_artifact_blocked_postman_environment"] == 1
          print(json.dumps({
              "baseline_canonical_documents": before["canonical_document_count"],
              "s0_canonical_documents": after["canonical_document_count"],
              "baseline_source_recall_at_5": before["local_lexical_source_recall_at_5"],
              "s0_source_recall_at_5": after["local_lexical_source_recall_at_5"],
              "s0_sentinel_exposed": after["secret_in_canonical"],
              "fixture_fingerprint_equal": True
          }, indent=2))
          PY
      - name: Upload safe synthetic measurements
        uses: actions/upload-artifact@v4
        with:
          name: api-artifact-s0-before-after
          path: benchmark-output/*.json
          if-no-files-found: error

name: Publish FetchCore release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: Release increment (bootstrap is v0.0.1)
        required: true
        default: patch
        type: choice
        options: [patch, minor, major]

permissions:
  contents: read

concurrency:
  group: fetchcore-release
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      pull-requests: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: true

      - name: Decide next action
        id: decide
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          CI_SHA: ${{ github.event.workflow_run.head_sha || '' }}
          REQUESTED_BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/heads/master ]] || { echo 'Release must run on master' >&2; exit 1; }
          git fetch origin master --tags
          current="$(git rev-parse HEAD)"
          if [[ "$EVENT" == workflow_run && "$CI_SHA" != "$current" ]]; then
            echo "Stale CI result; newer master must pass CI first."
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Release commits only publish after their own CI is green.
          if [[ "$EVENT" == workflow_run ]] &&
             [[ "$(git log -1 --format=%s)" =~ ^chore\(release\):\ (v[0-9]+\.[0-9]+\.[0-9]+)\ \[release-publish\]$ ]]; then
            echo "action=publish" >> "$GITHUB_OUTPUT"
            echo "tag=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          latest="$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)"
          if [[ -z "$latest" && "$EVENT" == workflow_run ]]; then
            echo "Bootstrap not approved yet. No automatic release."
            echo "action=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$EVENT" == workflow_run ]]; then
            prs="$(gh api "repos/$GITHUB_REPOSITORY/commits/$current/pulls")"
            count="$(jq '[.[] | select(.merged_at != null)] | length' <<< "$prs")"
            if [[ "$count" != 1 ]]; then
              echo "No unambiguous merged PR for this master commit."
              echo "action=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            labels="$(jq -r '[.[] | select(.merged_at != null)][0].labels[].name' <<< "$prs")"
            has_skip=false
            has_minor=false
            has_major=false
            if grep -Fxq 'release:skip' <<< "$labels"; then has_skip=true; fi
            if grep -Fxq 'release:minor' <<< "$labels"; then has_minor=true; fi
            if grep -Fxq 'release:major' <<< "$labels"; then has_major=true; fi
            if [[ "$has_major" == true && "$has_minor" == true ]] ||
               [[ "$has_skip" == true && ( "$has_minor" == true || "$has_major" == true ) ]]; then
              echo "::error::Conflicting release labels on the merged PR"
              exit 1
            fi
            if [[ "$has_skip" == true ]]; then
              echo "Explicit release:skip: validated administrative PR does not publish."
              echo "action=skip" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            bump=patch
            if grep -Fxq 'release:major' <<< "$labels"; then bump=major;
            elif grep -Fxq 'release:minor' <<< "$labels"; then bump=minor; fi
          else
            bump="$REQUESTED_BUMP"
          fi

          if [[ -z "$latest" ]]; then
            tag=v0.0.1
          else
            version="${latest#v}"
            IFS=. read -r major minor patch <<< "$version"
            case "$bump" in
              major) tag="v$((major+1)).0.0";;
              minor) tag="v$major.$((minor+1)).0";;
              patch) tag="v$major.$minor.$((patch+1))";;
              *) echo "::error::Unsupported bump"; exit 1;;
            esac
          fi
          echo "action=prepare" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Prepare versioned source
        if: steps.decide.outputs.action == 'prepare'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path
          version = os.environ["TAG"].removeprefix("v")
          pyproject = Path("pyproject.toml")
          original = pyproject.read_text()
          updated, count = re.subn(r'(?m)^version = "[^"]+"$', f'version = "{version}"', original, count=1)
          assert count == 1, "Could not identify project version"
          pyproject.write_text(updated)
          readme = Path("README.md")
          content = readme.read_text()
          content, count = re.subn(r'FetchCore is at `[^`]+`\.', f'FetchCore is at `{version}`.', content, count=1)
          assert count == 1, "Could not identify README version"
          readme.write_text(content)
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml README.md
          git commit -m "chore(release): $TAG [release-publish]"
          # Concurrent merges are rejected; never force a release commit.
          git push origin HEAD:master
          # GITHUB_TOKEN push does not trigger CI; dispatch it explicitly.
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref master
          gh workflow run self-dogfood.yml --repo "$GITHUB_REPOSITORY" --ref master

      - uses: actions/setup-python@v5
        if: steps.decide.outputs.action == 'publish'
        with:
          python-version: "3.11"

      - name: Require functional dogfood for the exact release revision
        if: steps.decide.outputs.action == 'publish'
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          for attempt in $(seq 1 40); do
            runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/self-dogfood.yml/runs?head_sha=$sha&per_page=100")"
            if jq -e --arg sha "$sha" '[.workflow_runs[] | select(.head_sha == $sha and .head_branch == "master" and (.event == "push" or .event == "workflow_dispatch") and .conclusion == "success")] | length > 0' <<< "$runs" >/dev/null; then
              exit 0
            fi
            sleep 15
          done
          echo 'No successful functional dogfood for release SHA' >&2
          exit 1

      - name: Download exact CI candidates and verify installed-artifact evidence
        if: steps.decide.outputs.action == 'publish'
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-assets reports
          gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name python-distributions --dir release-assets
          for runtime in 3.11 3.12 3.13 3.14 3.15; do
            gh run download "$CI_RUN_ID" --repo "$GITHUB_REPOSITORY" \
              --name "artifact-smoke-$runtime" --dir reports
          done
          python scripts/ci/release-evidence.py --dist release-assets --reports reports \
            --version "${TAG#v}" --source-sha "$(git rev-parse HEAD)" \
            --output release-assets/release-evidence.json

      - name: Build and validate release container from the verified wheel
        if: steps.decide.outputs.action == 'publish'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          image="fetchcore:$TAG"
          context="$(mktemp -d)"
          mkdir "$context/dist"
          cp release-assets/*.whl "$context/dist/"
          cp Dockerfile.release "$context/Dockerfile"
          source infra/images.lock
          scripts/ci/docker-pull.sh "$FETCHCORE_PYTHON_IMAGE"
          docker build --build-arg PYTHON_IMAGE="$FETCHCORE_PYTHON_IMAGE" \
            --label "org.opencontainers.image.revision=$(git rev-parse HEAD)" \
            --label "org.opencontainers.image.version=${TAG#v}" \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --tag "$image" "$context"
          archive="release-assets/fetchcore-$TAG-container.tar"
          docker image save --output "$archive" "$image"
          docker image load --input "$archive"
          docker run --rm --entrypoint python \
            --mount "type=bind,src=$PWD/scripts/ci/artifact-smoke.py,dst=/smoke.py,readonly" \
            "$image" -I /smoke.py --version "${TAG#v}" --require-non-root > reports/container.json
          image_id="$(docker image inspect --format '{{.Id}}' "$image")"
          python scripts/ci/release-evidence.py --dist release-assets --reports reports \
            --version "${TAG#v}" --source-sha "$(git rev-parse HEAD)" \
            --container-smoke reports/container.json --image "$image" --image-id "$image_id" \
            --container-archive "$archive" \
            --output release-assets/release-evidence.json

      - name: Upload validated candidate evidence
        if: steps.decide.outputs.action == 'publish'
        uses: actions/upload-artifact@v4
        with:
          name: release-candidate-${{ steps.decide.outputs.tag }}
          path: release-assets/
          if-no-files-found: error

      - name: Publish validated version
        if: steps.decide.outputs.action == 'publish'
        env:
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          set -euo pipefail
          declared="$(python3 - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )"
          [[ "$TAG" == "v$declared" ]] || { echo "::error::Project version does not match $TAG"; exit 1; }
          # A retry never replaces a completed release or existing assets.
          # Partial publication stays visible and requires operator reconciliation.
          releases="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100")"
          if jq -e --arg tag "$TAG" 'any(.[][]; .tag_name == $tag)' <<< "$releases" >/dev/null; then
            echo 'Release already exists; refusing to overwrite assets' >&2
            exit 1
          fi
          # Assemble the first release notes before pushing its immutable tag.
          initial_notes=""
          if [[ "$TAG" == "v0.0.1" ]] &&
             ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            curated="docs/releases/initial-release.md"
            [[ -s "$curated" ]] || { echo "::error::Missing curated v0.0.1 release notes"; exit 1; }
            generated="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
              -f tag_name="$TAG" -f target_commitish="$(git rev-parse HEAD)" --jq '.body')"
            [[ -n "$generated" && "$generated" != "null" ]] ||
              { echo "::error::Could not generate initial PR history"; exit 1; }
            initial_notes="$RUNNER_TEMP/fetchcore-v0.0.1-notes.md"
            {
              cat "$curated"
              printf '\n\n---\n\n## Complete change history (GitHub-generated)\n\n%s\n' "$generated"
            } > "$initial_notes"
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            [[ "$(git rev-list -n 1 "$TAG")" == "$(git rev-parse HEAD)" ]] || exit 1
          else
            git tag -a "$TAG" -m "FetchCore $TAG"
            git push origin "$TAG"
          fi
          # Keep the release draft until every exact candidate asset is attached.
          if [[ "$TAG" == "v0.0.1" ]]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --draft --title "FetchCore $TAG" --notes-file "$initial_notes"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --draft --title "FetchCore $TAG" --generate-notes
          fi
          gh release upload "$TAG" release-assets/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

      - name: Summary
        if: always()
        env:
          ACTION: ${{ steps.decide.outputs.action }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          echo "### FetchCore release" >> "$GITHUB_STEP_SUMMARY"
          echo "- action: ${ACTION:-not-decided}" >> "$GITHUB_STEP_SUMMARY"
          echo "- version: ${TAG:-not-decided}" >> "$GITHUB_STEP_SUMMARY"

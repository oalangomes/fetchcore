name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python scripts/check_docs.py
      - run: python scripts/docs/localize.py check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m mypy src

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m coverage run -m pytest -q
      - name: Report coverage
        run: python -m coverage report --fail-under=0
      - name: Re-evaluate frozen baseline ContextYield
        run: |
          python benchmarks/baseline-v1/context_yield.py \
            --artifacts benchmarks/baseline-v1/artifacts/V0.1 \
            --output "$RUNNER_TEMP/context-yield.json" \
            --markdown "$RUNNER_TEMP/context-yield.md"
          cat "$RUNNER_TEMP/context-yield.md"
          cat "$RUNNER_TEMP/context-yield.md" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m build

  runtime-devex:
    name: runtime-devex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose contract
        run: make compose-config
      - name: Build FetchCore image
        run: docker build --tag fetchcore:ci .
      - name: Smoke FetchCore image
        run: |
          docker run --rm --entrypoint sh fetchcore:ci -c \
            'test "$(id -u)" -ne 0 && command -v fetchcore >/dev/null && command -v fetchcore-mcp >/dev/null && python -c "import fetchcore; import importlib.metadata; assert importlib.metadata.version(\"fetchcore\")"'

  dogfood-smoke:
    name: dogfood-smoke
    runs-on: ubuntu-latest
    env:
      FETCHCORE_INDEX_WORKSPACE: ${{ github.workspace }}
      FETCHCORE_INDEX_REPOSITORY: ${{ github.repository }}
      FETCHCORE_INDEX_BRANCH: ${{ github.head_ref || github.ref_name }}
      FETCHCORE_INDEX_REVISION: ${{ github.sha }}
      FETCHCORE_INDEX_BACKEND: solr
      FETCHCORE_INDEX_BACKEND_SETTINGS: '{"url":"http://127.0.0.1:8983/solr","collection":"fetchcore-ci","projection_version":"3"}'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Start ephemeral Solr
        run: |
          docker run -d --name fetchcore-ci-solr \
            -p 127.0.0.1:8983:8983 \
            -v "$GITHUB_WORKSPACE/infra/solr/configset:/fetchcore-configset:ro" \
            solr:9.10.1 solr-precreate fetchcore-ci /fetchcore-configset
      - name: Wait for Solr
        run: |
          python - <<'PY'
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          url = "http://127.0.0.1:8983/solr/admin/info/system"
          error = None
          for _ in range(60):
              try:
                  with urlopen(url, timeout=2) as response:
                      if 200 <= response.status < 300:
                          raise SystemExit(0)
              except (OSError, URLError) as exc:
                  error = exc
                  time.sleep(2)
          raise SystemExit(f"Solr did not become ready: {error}")
          PY
      - name: Inspect the live Solr runtime
        env:
          FETCHCORE_BACKEND: solr
          FETCHCORE_SOLR_URL: http://127.0.0.1:8983/solr
          FETCHCORE_SOLR_COLLECTION: fetchcore-ci
        run: |
          set -o pipefail
          output="$RUNNER_TEMP/fetchcore-runtime-inspection"
          mkdir -p "$output"
          fetchcore doctor --json > "$output/doctor.json"
          fetchcore capabilities --json > "$output/capabilities.json"
          fetchcore config show --json > "$output/config.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "fetchcore-runtime-inspection"
          doctor = json.loads((root / "doctor.json").read_text(encoding="utf-8"))
          capabilities = json.loads((root / "capabilities.json").read_text(encoding="utf-8"))
          config = json.loads((root / "config.json").read_text(encoding="utf-8"))
          assert doctor["result"]["status"] == "healthy", doctor
          assert capabilities["result"]["backend"] == "solr", capabilities
          assert capabilities["result"]["indexing"] == {
              "incremental": True,
              "rebuild": True,
          }, capabilities
          assert config["result"]["config"]["backends"]["solr"]["collection"] == "fetchcore-ci"
          assert config["result"]["sources"]["backends.solr.collection"] == "environment"
          PY
      - name: Validate native targeted retrieval contract
        env:
          FETCHCORE_TARGETED_SOLR_URL: http://127.0.0.1:8983/solr
          FETCHCORE_TARGETED_SOLR_COLLECTION: fetchcore-ci
        run: python -m pytest -q tests/integration/retrieval/test_targeted_integration.py tests/integration/repository/test_repository_index_lifecycle_integration.py -m solr_integration
      - name: Exercise operational indexing CLI
        run: |
          set -o pipefail
          output="$RUNNER_TEMP/fetchcore-dogfood"
          mkdir -p "$output"
          fetchcore index bootstrap | tee "$output/bootstrap.json"
          fetchcore index status | tee "$output/status-before.json"
          fetchcore index dry-run | tee "$output/dry-run.json"
          fetchcore index sync | tee "$output/sync.json"
          fetchcore index status | tee "$output/status-after.json"
          fetchcore index sync | tee "$output/sync-noop.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          path = Path(os.environ["RUNNER_TEMP"]) / "fetchcore-dogfood" / "sync-noop.json"
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["result"]["noop"] is True, payload
          PY
      - name: Exercise CLI search and source journey
        env:
          FETCHCORE_BACKEND: solr
          FETCHCORE_SOLR_URL: http://127.0.0.1:8983/solr
          FETCHCORE_SOLR_COLLECTION: fetchcore-ci
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          workspace = Path(os.environ["GITHUB_WORKSPACE"])
          registry = Path(os.environ["RUNNER_TEMP"]) / "fetchcore-cli-registry"
          common = [
              "--cache-root", str(registry),
              "--allowed-root", str(workspace),
          ]

          def run(arguments: list[str]) -> dict[str, object]:
              completed = subprocess.run(
                  arguments,
                  check=True,
                  capture_output=True,
                  text=True,
              )
              return json.loads(completed.stdout)

          registration = run([
              "fetchcore", "repo", "--cache-root", str(registry),
              "--allowed-root", str(workspace), "add", str(workspace), "--json",
          ])
          assert registration["result"]["repository"] == os.environ["FETCHCORE_INDEX_REPOSITORY"]

          search = run([
              "fetchcore", "search",
              "where is runtime configuration resolved?",
              "--repo", os.environ["FETCHCORE_INDEX_REPOSITORY"],
              "--limit", "10", "--knowledge-type", "code",
              *common, "--json",
          ])
          assert search["status"] == "succeeded", search
          expected = [
              hit for hit in search["result"]["results"]
              if hit["source"].endswith("src/fetchcore/application/runtime_config.py")
          ]
          assert expected, search
          hit = expected[0]
          assert hit["revision"] == os.environ["FETCHCORE_INDEX_REVISION"], hit

          source = run([
              "fetchcore", "source", hit["source_ref"],
              "--revision", hit["revision"],
              *common, "--json",
          ])
          assert source["status"] == "succeeded", source
          assert source["result"]["repository"] == search["result"]["repository"]
          assert source["result"]["revision"] == hit["revision"]
          assert "def load_runtime_config" in source["result"]["content"]
          PY
      - name: Smoke real MCP search and source access
        run: |
          python scripts/dogfood_mcp_eval.py \
            --workspace . \
            --repository "$FETCHCORE_INDEX_REPOSITORY" \
            --revision "$FETCHCORE_INDEX_REVISION" \
            --solr-url http://127.0.0.1:8983/solr \
            --collection fetchcore-ci \
            --scenarios dogfood/scenarios/fetchcore-smoke.yaml \
            --output-json $RUNNER_TEMP/fetchcore-dogfood/mcp-smoke.json \
            --output-markdown $RUNNER_TEMP/fetchcore-dogfood/mcp-smoke.md
          cat $RUNNER_TEMP/fetchcore-dogfood/mcp-smoke.md >> "$GITHUB_STEP_SUMMARY"

      - name: Measure natural-query MCP self-evaluation
        run: |
          python scripts/dogfood_mcp_eval.py \
            --workspace . \
            --repository "$FETCHCORE_INDEX_REPOSITORY" \
            --revision "$FETCHCORE_INDEX_REVISION" \
            --solr-url http://127.0.0.1:8983/solr \
            --collection fetchcore-ci \
            --scenarios dogfood/scenarios/fetchcore-self.yaml \
            --output-json $RUNNER_TEMP/fetchcore-dogfood/mcp-evaluation.json \
            --output-markdown $RUNNER_TEMP/fetchcore-dogfood/mcp-evaluation.md \
            --report-only
          cat $RUNNER_TEMP/fetchcore-dogfood/mcp-evaluation.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dogfood smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fetchcore-dogfood-smoke-${{ github.run_id }}
          path: ${{ runner.temp }}/fetchcore-dogfood/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: Stop ephemeral Solr
        if: ${{ always() }}
        run: docker rm -f fetchcore-ci-solr >/dev/null 2>&1 || true

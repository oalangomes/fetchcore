name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m mypy src

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m coverage run -m pytest -q
      - name: Report coverage
        run: python -m coverage report --fail-under=0

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m build

  runtime-devex:
    name: runtime-devex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose contract
        run: docker compose --profile runtime --profile solr --profile opensearch --profile qdrant config --quiet
      - name: Build FetchCore image
        run: docker build --tag fetchcore:ci .
      - name: Smoke FetchCore image
        run: |
          docker run --rm --entrypoint sh fetchcore:ci -c \
            'test "$(id -u)" -ne 0 && command -v fetchcore >/dev/null && command -v fetchcore-mcp >/dev/null && python -c "import fetchcore; import importlib.metadata; assert importlib.metadata.version(\"fetchcore\")"'

  dogfood-smoke:
    name: dogfood-smoke
    runs-on: ubuntu-latest
    env:
      FETCHCORE_INDEX_WORKSPACE: ${{ github.workspace }}
      FETCHCORE_INDEX_REPOSITORY: ${{ github.repository }}
      FETCHCORE_INDEX_BRANCH: ${{ github.head_ref || github.ref_name }}
      FETCHCORE_INDEX_REVISION: ${{ github.sha }}
      FETCHCORE_INDEX_BACKEND: solr
      FETCHCORE_INDEX_BACKEND_SETTINGS: '{"url":"http://127.0.0.1:8983/solr","collection":"fetchcore-ci","projection_version":"3"}'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Start ephemeral Solr
        run: |
          docker run -d --name fetchcore-ci-solr \
            -p 127.0.0.1:8983:8983 \
            solr:9.10.1 solr-precreate fetchcore-ci
      - name: Wait for Solr
        run: |
          python - <<'PY'
          import time
          from urllib.error import URLError
          from urllib.request import urlopen

          url = "http://127.0.0.1:8983/solr/admin/info/system"
          error = None
          for _ in range(60):
              try:
                  with urlopen(url, timeout=2) as response:
                      if 200 <= response.status < 300:
                          raise SystemExit(0)
              except (OSError, URLError) as exc:
                  error = exc
                  time.sleep(2)
          raise SystemExit(f"Solr did not become ready: {error}")
          PY
      - name: Exercise operational indexing CLI
        run: |
          set -o pipefail
          mkdir -p .fetchcore-dogfood-ci
          fetchcore index bootstrap | tee .fetchcore-dogfood-ci/bootstrap.json
          fetchcore index status | tee .fetchcore-dogfood-ci/status-before.json
          fetchcore index dry-run | tee .fetchcore-dogfood-ci/dry-run.json
          fetchcore index sync | tee .fetchcore-dogfood-ci/sync.json
          fetchcore index status | tee .fetchcore-dogfood-ci/status-after.json
          fetchcore index sync | tee .fetchcore-dogfood-ci/sync-noop.json
          python - <<'PY'
          import json
          payload = json.load(open(".fetchcore-dogfood-ci/sync-noop.json", encoding="utf-8"))
          assert payload["result"]["noop"] is True, payload
          PY
      - name: Exercise real MCP retrieval
        run: |
          python scripts/dogfood_mcp_eval.py \
            --workspace . \
            --repository "$FETCHCORE_INDEX_REPOSITORY" \
            --revision "$FETCHCORE_INDEX_REVISION" \
            --solr-url http://127.0.0.1:8983/solr \
            --collection fetchcore-ci \
            --scenarios dogfood/scenarios/fetchcore-self.yaml \
            --output-json .fetchcore-dogfood-ci/mcp-evaluation.json \
            --output-markdown .fetchcore-dogfood-ci/mcp-evaluation.md
          cat .fetchcore-dogfood-ci/mcp-evaluation.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload dogfood smoke evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fetchcore-dogfood-smoke-${{ github.run_id }}
          path: .fetchcore-dogfood-ci/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 7
      - name: Stop ephemeral Solr
        if: ${{ always() }}
        run: docker rm -f fetchcore-ci-solr >/dev/null 2>&1 || true


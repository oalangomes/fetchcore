name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python scripts/check_docs.py
      - run: python scripts/docs/localize.py check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m mypy src

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run tests with coverage
        # The required grammar suite runs below with the structure extra on 3.11.
        # Other matrix environments intentionally test the core/dev install.
        run: python -m coverage run -m pytest -q --ignore=tests/unit/repository/test_multilingual_structure_ci.py
      - name: Report coverage
        run: python -m coverage report
      - name: Re-evaluate frozen baseline ContextYield
        run: |
          python benchmarks/baseline-v1/context_yield.py \
            --artifacts benchmarks/baseline-v1/artifacts/V0.1 \
            --output "$RUNNER_TEMP/context-yield.json" \
            --markdown "$RUNNER_TEMP/context-yield.md"
          cat "$RUNNER_TEMP/context-yield.md"
          cat "$RUNNER_TEMP/context-yield.md" >> "$GITHUB_STEP_SUMMARY"

  structural-languages:
    name: structural languages (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev,structure]"
      - name: Require optional grammars and run multilingual contracts
        run: |
          python -c 'import tree_sitter_language_pack'
          python -m pytest -q tests/unit/repository/test_optional_grammars.py tests/unit/repository/test_structured_navigation.py tests/unit/repository/test_multilingual_structure_ci.py tests/unit/repository/test_canonical_structure.py

  structural-live-backends:
    name: structural live (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        backend: [solr, opensearch, qdrant]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Start existing backend Compose service
        run: |
          if [ "${{ matrix.backend }}" = "solr" ]; then
            compose_file=infra/compose/solr-standalone.yml
          else
            compose_file=infra/compose/${{ matrix.backend }}.yml
          fi
          docker compose -p fc-structural-${{ matrix.backend }} -f "$compose_file" up -d --wait --wait-timeout 180
      - name: Wait for Qdrant readiness
        if: ${{ matrix.backend == 'qdrant' }}
        run: |
          python - <<'PY'
          import time
          from urllib.request import urlopen
          for _ in range(60):
              try:
                  with urlopen("http://127.0.0.1:6333/readyz", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except OSError:
                  time.sleep(2)
          raise SystemExit("Qdrant did not become ready")
          PY
      - name: Explicit index and live structural navigation
        if: ${{ matrix.backend != 'solr' }}
        env:
          FETCHCORE_LIVE_STRUCTURAL_BACKEND: ${{ matrix.backend }}
        run: python -m pytest -q tests/integration/test_structural_live_backends.py
      - name: Prepare disposable old Solr schema
        if: ${{ matrix.backend == 'solr' }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import shutil
          from pathlib import Path
          from xml.etree import ElementTree

          old = Path(os.environ["RUNNER_TEMP"]) / "fetchcore-reconcile-old-configset"
          shutil.copytree("infra/solr/configset", old)
          schema = old / "conf" / "schema.xml"
          root = ElementTree.parse(schema).getroot()
          removed = 0
          for field in list(root.findall("field")):
              if field.get("name") in {
                  "structural_names", "structural_qualified_names",
                  "structural_identities", "structural_incoming_identities",
              }:
                  root.remove(field)
                  removed += 1
          if removed != 4:
              raise SystemExit(f"expected four old-schema fields, removed {removed}")
          ElementTree.ElementTree(root).write(schema, encoding="unicode", xml_declaration=True)
          PY
          container="$(docker compose -p fc-structural-solr -f infra/compose/solr-standalone.yml ps -q solr)"
          test -n "$container"
          docker exec -u 0 "$container" sh -c \
            'mkdir -p /var/solr/data/configsets && chown solr:solr /var/solr/data/configsets'
          docker cp "$RUNNER_TEMP/fetchcore-reconcile-old-configset" \
            "$container:/var/solr/data/configsets/fetchcore-reconcile-old"
          docker cp infra/solr/configset \
            "$container:/var/solr/data/configsets/fetchcore-reconcile-current"
          docker exec -u 0 "$container" chown -R solr:solr \
            /var/solr/data/configsets/fetchcore-reconcile-old \
            /var/solr/data/configsets/fetchcore-reconcile-current
      - name: Live backend reconciliation and failure recovery
        env:
          FETCHCORE_LIVE_RECONCILE_BACKEND: ${{ matrix.backend }}
          FETCHCORE_SOLR_URL: http://127.0.0.1:8983/solr
          FETCHCORE_SOLR_OLD_CONFIGSET: fetchcore-reconcile-old
          FETCHCORE_SOLR_RECONCILE_CONFIGSET: fetchcore-reconcile-current
          FETCHCORE_OPENSEARCH_URL: http://127.0.0.1:9200
          FETCHCORE_QDRANT_URL: http://127.0.0.1:6333
        run: |
          set -euo pipefail
          python -m pytest -q tests/integration/test_reconciliation_live_backends.py \
            --junitxml="$RUNNER_TEMP/reconciliation-${{ matrix.backend }}.xml" \
            2>&1 | tee "$RUNNER_TEMP/reconciliation-${{ matrix.backend }}.log"
      - name: Upload live reconciliation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: reconciliation-live-${{ matrix.backend }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/reconciliation-${{ matrix.backend }}.xml
            ${{ runner.temp }}/reconciliation-${{ matrix.backend }}.log
          if-no-files-found: warn
      - name: Benchmark live structural acquisition at 1k and 10k chunks
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.number == 235 }}
        run: |
          python -m scripts.bench.live_structural_lookup \
            --backend ${{ matrix.backend }} --samples 20 \
            --output "$RUNNER_TEMP/structural-live-${{ matrix.backend }}.json"
      - name: Upload real structural benchmark evidence
        if: ${{ always() && github.event_name == 'pull_request' && github.event.pull_request.number == 235 }}
        uses: actions/upload-artifact@v4
        with:
          name: structural-live-${{ matrix.backend }}-${{ github.sha }}
          path: ${{ runner.temp }}/structural-live-${{ matrix.backend }}.json
          if-no-files-found: warn
      - name: Stop backend Compose service
        if: ${{ always() }}
        run: |
          if [ "${{ matrix.backend }}" = "solr" ]; then
            compose_file=infra/compose/solr-standalone.yml
          else
            compose_file=infra/compose/${{ matrix.backend }}.yml
          fi
          docker compose -p fc-structural-${{ matrix.backend }} -f "$compose_file" down -v

  solrcloud-infrastructure:
    name: SolrCloud readiness and collection contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Pull pinned Solr image
        run: |
          source infra/images.lock
          scripts/ci/docker-pull.sh "$FETCHCORE_SOLR_IMAGE"
          echo "FETCHCORE_SOLR_IMAGE=$FETCHCORE_SOLR_IMAGE" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FetchCore test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Start disposable SolrCloud
        env:
          FETCHCORE_SOLR_PORT: "8983"
        run: docker compose -p fc-solrcloud-contract -f infra/compose/solr.yml up -d --wait --wait-timeout 180
      - name: Verify routed mode, configset, full schema and real query
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import sys
          from urllib.request import urlopen

          sys.path.insert(0, str(Path("scripts").resolve()))
          import shared_infra as infra

          config = infra.route("dev", "oalangomes/fetchcore")
          config["FETCHCORE_SOLR_URL"] = "http://127.0.0.1:8983/solr"
          config["FETCHCORE_SOLR_COLLECTION"] = "fetchcore"
          assert infra.wait_ready("solr", config)["status"] == "ready"
          with urlopen(
              "http://127.0.0.1:8983/solr/fetchcore/select?q=*:*&rows=0&wt=json",
              timeout=10,
          ) as response:
              payload = json.load(response)
          assert payload["response"]["numFound"] == 0, payload
          PY
      - name: Verify live SolrCloud graph traversal preflight
        env:
          FETCHCORE_GRAPH_M0_SOLR_URL: http://127.0.0.1:8983/solr
        run: python -m pytest -q tests/integration/test_solr_graph_m0.py
      - name: Verify SolrCloud generation rebuild, incremental sync and retrieval
        env:
          FETCHCORE_SOLR_CLOUD_LIFECYCLE_URL: http://127.0.0.1:8983/solr
          FETCHCORE_SOLR_CLOUD_LIFECYCLE_CONFIGSET: fetchcore-projection-v3
        run: python -m pytest -q tests/integration/test_solrcloud_operational_lifecycle.py
      - name: Stop disposable SolrCloud
        if: always()
        run: docker compose -p fc-solrcloud-contract -f infra/compose/solr.yml down -v

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "build>=1.2"
      - name: Build candidate wheel and sdist once
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  artifact-smoke:
    name: artifact-smoke (Python ${{ matrix.python }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Install and smoke exact candidate artifacts outside checkout
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/ci/validate-artifacts.py --dist dist --version "$version" \
            --source-sha "$SOURCE_SHA" --output "evidence/python-${{ matrix.python }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-smoke-${{ matrix.python }}
          path: evidence/*.json
          if-no-files-found: error

  runtime-devex:
    name: runtime-devex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull pinned Python base image
        shell: bash
        env:
          IMAGE_OVERRIDE: ${{ vars.FETCHCORE_CI_PYTHON_IMAGE }}
        run: |
          set -euo pipefail
          source infra/images.lock
          image="${IMAGE_OVERRIDE:-$FETCHCORE_PYTHON_IMAGE}"
          scripts/ci/docker-pull.sh "$image"
          echo "FETCHCORE_PYTHON_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Validate Compose contract
        run: make compose-config
      - name: Build FetchCore image
        run: docker build --build-arg PYTHON_IMAGE="$FETCHCORE_PYTHON_IMAGE" --tag fetchcore:ci .
      - name: Smoke FetchCore image
        run: |
          docker run --rm --entrypoint sh fetchcore:ci -c \
            'test "$(id -u)" -ne 0 && command -v fetchcore >/dev/null && command -v fetchcore-mcp >/dev/null && python -c "import fetchcore; import importlib.metadata; assert importlib.metadata.version(\"fetchcore\")"'

name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python scripts/check_docs.py
      - run: python scripts/docs/localize.py check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: python -m mypy src

  test:
    name: test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: Run tests with coverage
        run: python -m coverage run -m pytest -q
      - name: Report coverage
        run: python -m coverage report
      - name: Re-evaluate frozen baseline ContextYield
        run: |
          python benchmarks/baseline-v1/context_yield.py \
            --artifacts benchmarks/baseline-v1/artifacts/V0.1 \
            --output "$RUNNER_TEMP/context-yield.json" \
            --markdown "$RUNNER_TEMP/context-yield.md"
          cat "$RUNNER_TEMP/context-yield.md"
          cat "$RUNNER_TEMP/context-yield.md" >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install "build>=1.2"
      - name: Build candidate wheel and sdist once
        run: |
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  artifact-smoke:
    name: artifact-smoke (Python ${{ matrix.python }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: python-distributions
          path: dist
      - name: Install and smoke exact candidate artifacts outside checkout
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          python scripts/ci/validate-artifacts.py --dist dist --version "$version" \
            --source-sha "$SOURCE_SHA" --output "evidence/python-${{ matrix.python }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-smoke-${{ matrix.python }}
          path: evidence/*.json
          if-no-files-found: error

  runtime-devex:
    name: runtime-devex
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull pinned Python base image
        shell: bash
        env:
          IMAGE_OVERRIDE: ${{ vars.FETCHCORE_CI_PYTHON_IMAGE }}
        run: |
          set -euo pipefail
          source infra/images.lock
          image="${IMAGE_OVERRIDE:-$FETCHCORE_PYTHON_IMAGE}"
          scripts/ci/docker-pull.sh "$image"
          echo "FETCHCORE_PYTHON_IMAGE=$image" >> "$GITHUB_ENV"
      - name: Validate Compose contract
        run: make compose-config
      - name: Build FetchCore image
        run: docker build --build-arg PYTHON_IMAGE="$FETCHCORE_PYTHON_IMAGE" --tag fetchcore:ci .
      - name: Smoke FetchCore image
        run: |
          docker run --rm --entrypoint sh fetchcore:ci -c \
            'test "$(id -u)" -ne 0 && command -v fetchcore >/dev/null && command -v fetchcore-mcp >/dev/null && python -c "import fetchcore; import importlib.metadata; assert importlib.metadata.version(\"fetchcore\")"'

name: Repository index

on:
  workflow_call:
    inputs:
      runner_labels_json:
        description: JSON array of self-hosted runner labels.
        required: false
        type: string
        default: '["self-hosted","Linux","X64"]'
      target_repository:
        description: Repository to index. Defaults to the caller repository.
        required: false
        type: string
        default: ""
      target_ref:
        description: Git ref/SHA to index. Defaults to the caller SHA.
        required: false
        type: string
        default: ""
      target_branch:
        description: Branch identity persisted in the FetchCore snapshot.
        required: false
        type: string
        default: ""
      fetchcore_ref:
        description: FetchCore ref used as the indexing/runtime implementation.
        required: false
        type: string
        default: master
      solr_url:
        description: Credential-free Solr base URL ending in /solr.
        required: false
        type: string
        default: http://127.0.0.1:8983/solr
      solr_deployment_mode:
        description: Expected deployment mode (auto, standalone, or solrcloud).
        required: false
        type: string
        default: auto
      collection:
        description: Dedicated Solr core (standalone) or collection (SolrCloud).
        required: false
        type: string
        default: fetchcore-knowledge
      create_if_missing:
        description: Authorize creation of only the named core/collection.
        required: false
        type: boolean
        default: false
      solr_provision_mode:
        description: Reuse the configured service or provision an owned local service when missing.
        required: false
        type: string
        default: reuse_only
      managed_solr:
        description: Deprecated compatibility alias for solr_provision_mode=provision_if_missing.
        required: false
        type: boolean
        default: false
      solr_configset:
        description: Pinned server-side configset name used for authorized resource creation.
        required: false
        type: string
        default: fetchcore
      solr_image:
        description: Digest-pinned image used only by explicit owned provisioning.
        required: false
        type: string
        default: solr:9.10.1@sha256:5ac29f32d689cef9722ec3b9f2c612ed11dce35d9e279ac0f7bd554ad76aa8cb
      solr_port:
        description: Deprecated; owned provisioning always selects a free loopback port.
        required: false
        type: string
        default: ""
      solr_volume:
        description: Deprecated; owned provisioning uses no pre-existing volume.
        required: false
        type: string
        default: ""
      index_lifecycle:
        description: Explicit indexing intent (plan, sync, or rebuild).
        required: false
        type: string
        default: sync
      require_existing_snapshot:
        description: Fail before writing unless a compatible snapshot already exists.
        required: false
        type: boolean
        default: false
      evaluate:
        description: Run configured MCP dogfood scenarios after indexing.
        required: false
        type: boolean
        default: false
      evaluation_modes_json:
        description: Retrieval modes to evaluate (lexical, dense, hybrid).
        required: false
        type: string
        default: '["lexical"]'
      embedding_provider:
        description: Embedding provider used by explicit dense/hybrid indexing and serving.
        required: false
        type: string
        default: ollama
      embedding_model:
        description: Embedding model identity used by indexing and serving.
        required: false
        type: string
        default: embeddinggemma
      embedding_dimensions:
        description: Vector dimensions; the current Solr schema requires 768.
        required: false
        type: number
        default: 768
      ollama_url:
        description: Explicit Ollama endpoint; the workflow never downloads a model.
        required: false
        type: string
        default: http://127.0.0.1:11434
      evaluation_gate:
        description: Fail when one or more MCP evaluation scenarios miss expected evidence.
        required: false
        type: boolean
        default: false
      scenarios_path:
        description: Scenario YAML path relative to the target repository.
        required: false
        type: string
        default: ""
      artifact_retention_days:
        description: Retention for indexing/evaluation reports.
        required: false
        type: number
        default: 14

  workflow_dispatch:
    inputs:
      runner_labels_json:
        description: JSON array of self-hosted runner labels.
        required: false
        type: string
        default: '["self-hosted","Linux","X64"]'
      target_repository:
        description: Repository to index.
        required: false
        type: string
        default: oalangomes/fetchcore
      target_ref:
        description: Ref/SHA to index.
        required: false
        type: string
        default: master
      target_branch:
        description: Branch identity persisted in the snapshot.
        required: false
        type: string
        default: master
      fetchcore_ref:
        description: FetchCore implementation ref.
        required: false
        type: string
        default: master
      solr_url:
        description: Credential-free Solr base URL ending in /solr.
        required: false
        type: string
        default: http://127.0.0.1:8983/solr
      solr_deployment_mode:
        description: Expected deployment mode (auto, standalone, or solrcloud).
        required: false
        type: string
        default: auto
      collection:
        description: Dedicated Solr core or collection.
        required: false
        type: string
        default: fetchcore
      create_if_missing:
        description: Authorize creation of only the named core/collection.
        required: false
        type: boolean
        default: false
      solr_provision_mode:
        description: reuse_only or provision_if_missing.
        required: false
        type: string
        default: reuse_only
      managed_solr:
        description: Deprecated compatibility alias for provision_if_missing.
        required: false
        type: boolean
        default: false
      solr_configset:
        description: Server-side configset name for authorized resource creation.
        required: false
        type: string
        default: fetchcore
      solr_image:
        description: Digest-pinned image used only by explicit owned provisioning.
        required: false
        type: string
        default: solr:9.10.1@sha256:5ac29f32d689cef9722ec3b9f2c612ed11dce35d9e279ac0f7bd554ad76aa8cb
      solr_port:
        description: Deprecated; a free port is selected automatically.
        required: false
        type: string
        default: ""
      solr_volume:
        description: Deprecated; no pre-existing volume is used.
        required: false
        type: string
        default: ""
      index_lifecycle:
        description: Explicit indexing intent (plan, sync, or rebuild).
        required: false
        type: choice
        options: [plan, sync, rebuild]
        default: sync
      evaluate:
        description: Run MCP evaluation after indexing.
        required: false
        type: boolean
        default: false
      evaluation_modes_json:
        description: JSON retrieval mode list (lexical, dense, hybrid).
        required: false
        type: string
        default: '["lexical"]'
      embedding_provider:
        description: Embedding provider for dense/hybrid.
        required: false
        type: string
        default: ollama
      embedding_model:
        description: Embedding model identity for dense/hybrid.
        required: false
        type: string
        default: embeddinggemma
      embedding_dimensions:
        description: Vector dimensions; the current Solr schema requires 768.
        required: false
        type: number
        default: 768
      ollama_url:
        description: Ollama endpoint; no model is downloaded by this workflow.
        required: false
        type: string
        default: http://127.0.0.1:11434
      evaluation_gate:
        description: Fail when MCP evaluation scenarios miss expected evidence.
        required: false
        type: boolean
        default: false
      scenarios_path:
        description: Scenario YAML in target repository when evaluate=true.
        required: false
        type: string
        default: ""
      artifact_retention_days:
        description: Artifact retention days.
        required: false
        type: number
        default: 14

permissions:
  contents: read

# GitHub scopes concurrency to the caller repository. The resource-only key
# serializes writers inside that scope; cross-repository callers still require
# distinct resources because Actions cannot provide a global distributed lock.
concurrency:
  group: fetchcore-solr-resource-${{ inputs.collection }}
  cancel-in-progress: false

jobs:
  index:
    name: index
    runs-on: ${{ fromJSON(inputs.runner_labels_json) }}
    timeout-minutes: 45

    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.target_repository || github.repository }}
          ref: ${{ inputs.target_ref || github.sha }}
          fetch-depth: 0
          path: target

      - name: Checkout FetchCore runtime
        uses: actions/checkout@v4
        with:
          repository: oalangomes/fetchcore
          ref: ${{ inputs.fetchcore_ref }}
          fetch-depth: 1
          path: .fetchcore-runtime

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: .fetchcore-runtime/pyproject.toml

      - name: Install FetchCore runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".fetchcore-runtime[mcp]"

      - name: Validate workflow policy
        env:
          DEPLOYMENT_MODE: ${{ inputs.solr_deployment_mode }}
          PROVISION_MODE: ${{ inputs.solr_provision_mode }}
          INDEX_LIFECYCLE: ${{ inputs.index_lifecycle }}
          EVALUATION_MODES_JSON: ${{ inputs.evaluation_modes_json }}
          EMBEDDING_PROVIDER: ${{ inputs.embedding_provider }}
          EMBEDDING_MODEL: ${{ inputs.embedding_model }}
          EMBEDDING_DIMENSIONS: ${{ inputs.embedding_dimensions }}
          OLLAMA_URL: ${{ inputs.ollama_url }}
          TARGET_REPOSITORY: ${{ inputs.target_repository || github.repository }}
          SOLR_PORT: ${{ inputs.solr_port }}
          SOLR_VOLUME: ${{ inputs.solr_volume }}
        run: |
          set -euo pipefail
          case "$DEPLOYMENT_MODE" in auto|standalone|solrcloud) ;; *) echo "invalid solr_deployment_mode" >&2; exit 2;; esac
          case "$PROVISION_MODE" in reuse_only|provision_if_missing) ;; *) echo "invalid solr_provision_mode" >&2; exit 2;; esac
          case "$INDEX_LIFECYCLE" in plan|sync|rebuild) ;; *) echo "invalid index_lifecycle" >&2; exit 2;; esac
          if [ -n "$SOLR_PORT" ]; then
            echo "solr_port is deprecated and no longer controls owned provisioning; configure solr_url for a persistent/external service" >&2
            exit 2
          fi
          if [ -n "$SOLR_VOLUME" ]; then
            echo "solr_volume is deprecated and is no longer used; persistent state must belong to the explicitly configured external Solr service" >&2
            exit 2
          fi
          python - <<'PY'
          import json
          import os
          import re

          repository = os.environ["TARGET_REPOSITORY"]
          if not re.fullmatch(r"[A-Za-z0-9_.-]+(?:/[A-Za-z0-9_.-]+)+", repository):
              raise SystemExit("target_repository must use owner/name form")

          modes = json.loads(os.environ["EVALUATION_MODES_JSON"])
          if not isinstance(modes, list) or not modes or any(not isinstance(mode, str) for mode in modes):
              raise SystemExit("evaluation_modes_json must be a non-empty JSON string array")
          unsupported = sorted(set(modes) - {"lexical", "dense", "hybrid"})
          if unsupported:
              raise SystemExit("unsupported evaluation modes: " + ", ".join(unsupported))
          if set(modes) & {"dense", "hybrid"}:
              if not os.environ["EMBEDDING_PROVIDER"].strip():
                  raise SystemExit("embedding_provider is required for dense/hybrid")
              if not os.environ["EMBEDDING_MODEL"].strip():
                  raise SystemExit("embedding_model is required for dense/hybrid")
              if int(os.environ["EMBEDDING_DIMENSIONS"]) != 768:
                  raise SystemExit("embedding_dimensions must be 768 for the current Solr schema")
              if not os.environ["OLLAMA_URL"].strip():
                  raise SystemExit("ollama_url is required for dense/hybrid")
          PY

      - name: Resolve indexing identity
        id: identity
        env:
          TARGET_REPOSITORY: ${{ inputs.target_repository || github.repository }}
          TARGET_BRANCH: ${{ inputs.target_branch || github.ref_name }}
        run: |
          set -euo pipefail
          revision="$(git -C target rev-parse HEAD)"
          git check-ref-format --branch "$TARGET_BRANCH" >/dev/null
          git -C target switch --force-create "$TARGET_BRANCH" "$revision" >/dev/null
          printf 'repository=%s\n' "$TARGET_REPOSITORY" >> "$GITHUB_OUTPUT"
          printf 'branch=%s\n' "$TARGET_BRANCH" >> "$GITHUB_OUTPUT"
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
          run_root="$RUNNER_TEMP/fetchcore-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf 'FETCHCORE_RUN_ROOT=%s\n' "$run_root" >> "$GITHUB_ENV"
          printf 'FETCHCORE_DOGFOOD_OUTPUT=%s/evidence\n' "$run_root" >> "$GITHUB_ENV"
          printf 'FETCHCORE_REPOSITORY_CACHE=%s/repository-cache\n' "$run_root" >> "$GITHUB_ENV"
          mkdir -p "$run_root/evidence"

      - name: Discover and prepare Solr resource
        env:
          SOLR_URL: ${{ inputs.solr_url }}
          DEPLOYMENT_MODE: ${{ inputs.solr_deployment_mode }}
          COLLECTION: ${{ inputs.collection }}
          REPOSITORY: ${{ steps.identity.outputs.repository }}
          CREATE_IF_MISSING: ${{ inputs.create_if_missing }}
          PROVISION_MODE: ${{ inputs.solr_provision_mode }}
          MANAGED_SOLR: ${{ inputs.managed_solr }}
          CONFIGSET: ${{ inputs.solr_configset }}
          SOLR_IMAGE: ${{ inputs.solr_image }}
        run: |
          set -euo pipefail
          effective_provision_mode="$PROVISION_MODE"
          if [ "$MANAGED_SOLR" = "true" ]; then
            effective_provision_mode="provision_if_missing"
            echo "::warning::managed_solr is deprecated; use solr_provision_mode=provision_if_missing"
          fi
          args=(
            prepare
            --solr-url "$SOLR_URL"
            --deployment-mode "$DEPLOYMENT_MODE"
            --resource "$COLLECTION"
            --repository "$REPOSITORY"
            --provision-mode "$effective_provision_mode"
            --configset "$CONFIGSET"
            --solr-image "$SOLR_IMAGE"
            --configset-dir "$GITHUB_WORKSPACE/.fetchcore-runtime/infra/solr/configset"
            --owner-token "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            --output-json "$FETCHCORE_DOGFOOD_OUTPUT/solr-preflight.json"
            --output-env "$FETCHCORE_RUN_ROOT/solr.env"
          )
          if [ "$CREATE_IF_MISSING" = "true" ]; then args+=(--create-if-missing); fi
          python -m fetchcore.operational.solr_runtime "${args[@]}"
          cat "$FETCHCORE_RUN_ROOT/solr.env" >> "$GITHUB_ENV"

      - name: Configure FetchCore indexing
        env:
          REPOSITORY: ${{ steps.identity.outputs.repository }}
          COLLECTION: ${{ inputs.collection }}
          EVALUATION_MODES_JSON: ${{ inputs.evaluation_modes_json }}
          EMBEDDING_PROVIDER: ${{ inputs.embedding_provider }}
          EMBEDDING_MODEL: ${{ inputs.embedding_model }}
          EMBEDDING_DIMENSIONS: ${{ inputs.embedding_dimensions }}
          OLLAMA_URL: ${{ inputs.ollama_url }}
          TARGET_WORKSPACE: ${{ github.workspace }}/target
          TARGET_REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          set -euo pipefail
          printf 'FETCHCORE_INDEX_BACKEND=solr\n' >> "$GITHUB_ENV"
          python - <<'PY' >> "$GITHUB_ENV"
          import json
          import os
          payload = {
              "url": os.environ["FETCHCORE_SOLR_URL"],
              "collection": os.environ["COLLECTION"],
              "projection_version": "3",
          }
          print("FETCHCORE_INDEX_BACKEND_SETTINGS=" + json.dumps(payload, separators=(",", ":")))
          print("FETCHCORE_BACKEND=solr")
          print("FETCHCORE_WORKSPACE=" + os.environ["TARGET_WORKSPACE"])
          print("FETCHCORE_REPOSITORY=" + os.environ["REPOSITORY"])
          print("FETCHCORE_REVISION=" + os.environ["TARGET_REVISION"])
          print("FETCHCORE_SOLR_URL=" + os.environ["FETCHCORE_SOLR_URL"])
          print("FETCHCORE_SOLR_COLLECTION=" + os.environ["COLLECTION"])
          modes = set(json.loads(os.environ["EVALUATION_MODES_JSON"]))
          if modes & {"dense", "hybrid"}:
              retrieval = {
                  "dense": {
                      "enabled": True,
                      "embedding": {
                          "provider": os.environ["EMBEDDING_PROVIDER"],
                          "model": os.environ["EMBEDDING_MODEL"],
                          "dimensions": int(os.environ["EMBEDDING_DIMENSIONS"]),
                      },
                  },
                  "hybrid": {"enabled": "hybrid" in modes},
              }
              print("FETCHCORE_RETRIEVAL=" + json.dumps(retrieval, separators=(",", ":")))
              print("FETCHCORE_OLLAMA_URL=" + os.environ["OLLAMA_URL"])
          PY
          fetchcore repo \
            --cache-root "$FETCHCORE_REPOSITORY_CACHE" \
            --allowed-root "$GITHUB_WORKSPACE" \
            add target --provider local-workspace --json \
            | tee "$FETCHCORE_DOGFOOD_OUTPUT/repository-registration.json"

      - name: Bootstrap FetchCore Solr schema
        env:
          FETCHCORE_INDEX_WORKSPACE: ${{ github.workspace }}/target
          FETCHCORE_INDEX_REPOSITORY: ${{ steps.identity.outputs.repository }}
          FETCHCORE_INDEX_BRANCH: ${{ steps.identity.outputs.branch }}
          FETCHCORE_INDEX_REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          set -o pipefail
          fetchcore index bootstrap | tee "$FETCHCORE_DOGFOOD_OUTPUT/bootstrap.json"

      - name: Index status before execution
        env:
          REPOSITORY: ${{ steps.identity.outputs.repository }}
        run: |
          set -o pipefail
          fetchcore index \
            --cache-root "$FETCHCORE_REPOSITORY_CACHE" \
            --allowed-root "$GITHUB_WORKSPACE" \
            status "$REPOSITORY" --json \
            | tee "$FETCHCORE_DOGFOOD_OUTPUT/status-before.json"

      - name: Require compatible existing operational snapshot
        if: ${{ inputs.require_existing_snapshot }}
        env:
          EXPECTED_REPOSITORY: ${{ steps.identity.outputs.repository }}
          EXPECTED_BRANCH: ${{ steps.identity.outputs.branch }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          envelope = json.loads((Path(os.environ["FETCHCORE_DOGFOOD_OUTPUT"]) / "status-before.json").read_text())
          status = envelope.get("result")
          if (envelope.get("status") != "succeeded" or not isinstance(status, dict)
                  or status.get("repository") != os.environ["EXPECTED_REPOSITORY"]
                  or status.get("branch") != os.environ["EXPECTED_BRANCH"]
                  or status.get("mode") not in {"noop", "incremental"}
                  or status.get("currentness") not in {"current", "stale"}
                  or status.get("incremental_possible") is not True
                  or status.get("schema_compatible") is not True
                  or status.get("projection_compatible") is not True
                  or not isinstance(status.get("indexed_revision"), str)
                  or not status["indexed_revision"]
                  or not isinstance(status.get("indexing_fingerprint"), str)
                  or not status["indexing_fingerprint"]
                  or not isinstance(status.get("projection_fingerprint"), str)
                  or not status["projection_fingerprint"]):
              raise SystemExit("Operational snapshot is absent or incompatible; explicit migration required")
          PY

      - name: Plan index lifecycle
        env:
          REPOSITORY: ${{ steps.identity.outputs.repository }}
        run: |
          set -o pipefail
          fetchcore index \
            --cache-root "$FETCHCORE_REPOSITORY_CACHE" \
            --allowed-root "$GITHUB_WORKSPACE" \
            plan "$REPOSITORY" --json \
            | tee "$FETCHCORE_DOGFOOD_OUTPUT/plan.json"

      - name: Synchronize repository index
        if: ${{ inputs.index_lifecycle == 'sync' }}
        env:
          REPOSITORY: ${{ steps.identity.outputs.repository }}
        run: |
          set -o pipefail
          fetchcore index \
            --cache-root "$FETCHCORE_REPOSITORY_CACHE" \
            --allowed-root "$GITHUB_WORKSPACE" \
            sync "$REPOSITORY" --json \
            | tee "$FETCHCORE_DOGFOOD_OUTPUT/execution.json"

      - name: Explicitly rebuild repository index
        if: ${{ inputs.index_lifecycle == 'rebuild' }}
        env:
          REPOSITORY: ${{ steps.identity.outputs.repository }}
        run: |
          set -o pipefail
          fetchcore index \
            --cache-root "$FETCHCORE_REPOSITORY_CACHE" \
            --allowed-root "$GITHUB_WORKSPACE" \
            rebuild "$REPOSITORY" --json \
            | tee "$FETCHCORE_DOGFOOD_OUTPUT/execution.json"

      - name: Index status after execution
        env:
          REPOSITORY: ${{ steps.identity.outputs.repository }}
        run: |
          set -o pipefail
          fetchcore index \
            --cache-root "$FETCHCORE_REPOSITORY_CACHE" \
            --allowed-root "$GITHUB_WORKSPACE" \
            status "$REPOSITORY" --json \
            | tee "$FETCHCORE_DOGFOOD_OUTPUT/status-after.json"

      - name: Verify persisted index identity
        if: ${{ inputs.index_lifecycle != 'plan' }}
        env:
          EXPECTED_REPOSITORY: ${{ steps.identity.outputs.repository }}
          EXPECTED_REVISION: ${{ steps.identity.outputs.revision }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = Path(os.environ["FETCHCORE_DOGFOOD_OUTPUT"])
          status = json.loads((evidence / "status-after.json").read_text())
          observed = status.get("result")
          if (status.get("status") != "succeeded" or not isinstance(observed, dict)
              or observed.get("repository") != os.environ["EXPECTED_REPOSITORY"]
              or observed.get("indexed_revision") != os.environ["EXPECTED_REVISION"]
              or observed.get("currentness") != "current"
              or observed.get("schema_compatible") is not True
              or observed.get("projection_compatible") is not True
              or not observed.get("snapshot_indexing_fingerprint")
              or observed.get("snapshot_indexing_fingerprint") != observed.get("indexing_fingerprint")
              or not observed.get("snapshot_projection_fingerprint")
              or observed.get("snapshot_projection_fingerprint") != observed.get("projection_fingerprint")):
              raise SystemExit("Persisted snapshot identity is not current and compatible")
          PY

      - name: Inspect requested Solr retrieval readiness
        if: ${{ inputs.index_lifecycle != 'plan' }}
        run: |
          set -o pipefail
          fetchcore readiness --json | tee "$FETCHCORE_DOGFOOD_OUTPUT/readiness.json"

      - name: Evaluate configured retrieval modes through MCP
        if: ${{ inputs.evaluate && inputs.index_lifecycle != 'plan' }}
        env:
          REPOSITORY: ${{ steps.identity.outputs.repository }}
          REVISION: ${{ steps.identity.outputs.revision }}
          COLLECTION: ${{ inputs.collection }}
          SCENARIOS_PATH: ${{ inputs.scenarios_path }}
          EVALUATION_GATE: ${{ inputs.evaluation_gate }}
          EVALUATION_MODES_JSON: ${{ inputs.evaluation_modes_json }}
          EMBEDDING_PROVIDER: ${{ inputs.embedding_provider }}
          EMBEDDING_MODEL: ${{ inputs.embedding_model }}
          EMBEDDING_DIMENSIONS: ${{ inputs.embedding_dimensions }}
          OLLAMA_URL: ${{ inputs.ollama_url }}
        run: |
          set -euo pipefail
          test -n "$SCENARIOS_PATH" || { echo "scenarios_path is required when evaluate=true" >&2; exit 2; }
          while IFS= read -r mode; do
            args=(
              --workspace target
              --repository "$REPOSITORY"
              --revision "$REVISION"
              --solr-url "$FETCHCORE_SOLR_URL"
              --collection "$COLLECTION"
              --mode "$mode"
              --embedding-provider "$EMBEDDING_PROVIDER"
              --embedding-model "$EMBEDDING_MODEL"
              --embedding-dimensions "$EMBEDDING_DIMENSIONS"
              --ollama-url "$OLLAMA_URL"
              --scenarios "target/$SCENARIOS_PATH"
              --output-json "$FETCHCORE_DOGFOOD_OUTPUT/mcp-evaluation-$mode.json"
              --output-markdown "$FETCHCORE_DOGFOOD_OUTPUT/mcp-evaluation-$mode.md"
            )
            if [ "$EVALUATION_GATE" != "true" ]; then args+=(--report-only); fi
            python .fetchcore-runtime/scripts/dogfood_mcp_eval.py "${args[@]}"
            cat "$FETCHCORE_DOGFOOD_OUTPUT/mcp-evaluation-$mode.md" >> "$GITHUB_STEP_SUMMARY"
          done < <(python -c 'import json, os; print("\\n".join(json.loads(os.environ["EVALUATION_MODES_JSON"])))')

      - name: Compose bounded run evidence
        if: ${{ success() }}
        env:
          REPOSITORY: ${{ steps.identity.outputs.repository }}
          REVISION: ${{ steps.identity.outputs.revision }}
          INDEX_LIFECYCLE: ${{ inputs.index_lifecycle }}
          EVALUATION_MODES_JSON: ${{ inputs.evaluate && inputs.evaluation_modes_json || '[]' }}
        run: |
          set -euo pipefail
          args=(
            --repository "$REPOSITORY"
            --revision "$REVISION"
            --lifecycle "$INDEX_LIFECYCLE"
            --evaluation-modes-json "$EVALUATION_MODES_JSON"
            --preflight "$FETCHCORE_DOGFOOD_OUTPUT/solr-preflight.json"
            --bootstrap "$FETCHCORE_DOGFOOD_OUTPUT/bootstrap.json"
            --plan "$FETCHCORE_DOGFOOD_OUTPUT/plan.json"
            --status "$FETCHCORE_DOGFOOD_OUTPUT/status-after.json"
            --output "$FETCHCORE_DOGFOOD_OUTPUT/run-evidence.json"
          )
          if [ -f "$FETCHCORE_DOGFOOD_OUTPUT/execution.json" ]; then
            args+=(--execution "$FETCHCORE_DOGFOOD_OUTPUT/execution.json")
          fi
          python .fetchcore-runtime/scripts/ci/build-index-evidence.py "${args[@]}"
          {
            echo '### FetchCore index evidence'
            echo '```json'
            cat "$FETCHCORE_DOGFOOD_OUTPUT/run-evidence.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload FetchCore indexing evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: fetchcore-index-${{ inputs.collection }}-${{ github.run_id }}
          path: ${{ runner.temp }}/fetchcore-${{ github.run_id }}-${{ github.run_attempt }}/evidence/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: ${{ inputs.artifact_retention_days }}

      - name: Clean up owned Solr runtime
        if: ${{ always() }}
        run: |
          state="$FETCHCORE_DOGFOOD_OUTPUT/solr-preflight.json"
          if [ -f "$state" ]; then
            python -m fetchcore.operational.solr_runtime cleanup --state "$state"
          fi

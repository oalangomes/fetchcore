name: FetchCore operational Solr index

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  operational-index:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/repository-index.yml
    with:
      runner_labels_json: ${{ vars.FETCHCORE_INDEX_RUNNER_LABELS_JSON || '["self-hosted","Linux","X64","fetchcore"]' }}
      target_repository: oalangomes/fetchcore
      target_ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      target_branch: master
      fetchcore_ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      solr_url: ${{ vars.FETCHCORE_OPERATIONAL_SOLR_URL || 'http://127.0.0.1:38983/solr' }}
      solr_deployment_mode: standalone
      collection: ${{ vars.FETCHCORE_OPERATIONAL_SOLR_COLLECTION || 'fc-operational-fetchcore-635ab7352c2850f2' }}
      create_if_missing: false
      solr_provision_mode: reuse_only
      require_existing_snapshot: true
      index_lifecycle: sync
      evaluate: false
      evaluation_modes_json: '["lexical"]'
      artifact_retention_days: 30

name: Localize documentation (PT-BR)

on:
  push:
    branches: [master]
    paths:
      - README.md
      - docs/README.md
      - docs/architecture/**
      - docs/concepts/**
      - docs/guides/**
      - docs/reference/**
      - docs/adr/**
      - docs/benchmarks/protocol.md
      - docs/release-policy.md
      - docs/i18n/**
      - scripts/docs/**
      - scripts/check_docs.py
      - .github/workflows/docs-localization.yml
  workflow_dispatch:
    inputs:
      force:
        description: Regenerate every included document
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  actions: write # Explicit CI dispatch for GITHUB_TOKEN-created PRs.

concurrency:
  group: fetchcore-docs-localization
  cancel-in-progress: true

jobs:
  localize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      vars.FETCHCORE_DOCS_LOCALIZATION_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      FETCHCORE_DOCS_TRANSLATION_API_KEY: ${{ secrets.FETCHCORE_DOCS_TRANSLATION_API_KEY }}
      FETCHCORE_DOCS_TRANSLATION_API_URL: ${{ vars.FETCHCORE_DOCS_TRANSLATION_API_URL }}
      FETCHCORE_DOCS_TRANSLATION_MODEL: ${{ vars.FETCHCORE_DOCS_TRANSLATION_MODEL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Validate localization configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=()
          [[ -n "$FETCHCORE_DOCS_TRANSLATION_API_KEY" ]] || missing+=(FETCHCORE_DOCS_TRANSLATION_API_KEY)
          [[ -n "$FETCHCORE_DOCS_TRANSLATION_API_URL" ]] || missing+=(FETCHCORE_DOCS_TRANSLATION_API_URL)
          [[ -n "$FETCHCORE_DOCS_TRANSLATION_MODEL" ]] || missing+=(FETCHCORE_DOCS_TRANSLATION_MODEL)
          if (( ${#missing[@]} )); then
            printf 'Missing localization configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          [[ "$FETCHCORE_DOCS_TRANSLATION_API_URL" == https://* ]] || {
            echo "FETCHCORE_DOCS_TRANSLATION_API_URL must use HTTPS" >&2
            exit 1
          }
      - run: python -m pip install "pyyaml>=6.0"
      - name: Restore open localization work on latest master
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin master
          git switch -C automation/docs-pt-br origin/master
          echo "FETCHCORE_DOCS_SOURCE_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          if git ls-remote --exit-code --heads origin automation/docs-pt-br >/dev/null; then
            git fetch origin automation/docs-pt-br:refs/remotes/origin/automation/docs-pt-br
            # Preserve unmerged translations so unchanged fingerprints are skipped.
            git restore --source origin/automation/docs-pt-br --worktree -- README.pt-BR.md docs/pt-BR/
          fi
      - name: Generate and validate
        shell: bash
        env:
          FORCE: ${{ inputs.force || 'false' }}
        run: |
          set -euo pipefail
          args=()
          if [[ "$FORCE" == true ]]; then args+=(--force); fi
          python scripts/docs/localize.py sync "${args[@]}" --report "$RUNNER_TEMP/localization-report.json"
          python scripts/docs/localize.py check --strict
          python scripts/check_docs.py --include-localizations
          git diff --check
      - name: Write review body
        shell: bash
        run: |
          python - "$RUNNER_TEMP/localization-report.json" "$RUNNER_TEMP/localization-pr.md" <<'PY'
          import json
          import sys
          from pathlib import Path

          report = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          lines = [
              "## PT-BR documentation sync", "",
              f"Source revision: `{report['source_revision']}`  ",
              f"Translation schema: `{report['schema']}`  ",
              f"Provider/model: `{report['provider']}` / `{report['model']}`  ",
              f"Glossary SHA-256: `{report['glossary_sha256']}`  ",
              f"Source characters sent for translation: `{report['translated_characters']}`", "",
          ]
          for field in ("translated", "skipped", "removed"):
              entries = report[field]
              lines.extend([f"### {field.title()} ({len(entries)})", ""])
              lines.extend(f"- `{entry}`" for entry in entries)
              if not entries:
                  lines.append("- None")
              lines.append("")
          lines.append("Validation: localization and documentation checks passed. Review terminology, meaning, links and formatting before merging.")
          Path(sys.argv[2]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Update one review PR
        shell: bash
        run: |
          set -euo pipefail
          if git show-ref --verify --quiet refs/remotes/origin/automation/docs-pt-br &&
             git diff --quiet origin/automation/docs-pt-br -- README.pt-BR.md docs/pt-BR/; then
            echo "Generated translations match the existing review branch."
            exit 0
          fi
          git add README.pt-BR.md docs/pt-BR/
          if git diff --cached --quiet; then
            echo "No translation changes; no commit or PR update."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync PT-BR translations"
          git push --force-with-lease origin HEAD:automation/docs-pt-br
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head automation/docs-pt-br --base master --state open --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/localization-pr.md"
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --base master --head automation/docs-pt-br \
              --title "docs: sync PT-BR translations" --body-file "$RUNNER_TEMP/localization-pr.md"
          fi
          gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref automation/docs-pt-br

name: FetchCore self dogfood

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  self-index:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    uses: ./.github/workflows/repository-index.yml
    with:
      runner_labels_json: ${{ vars.FETCHCORE_INDEX_RUNNER_LABELS_JSON || '["self-hosted","Linux","X64","fetchcore"]' }}
      target_repository: oalangomes/fetchcore
      target_ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      target_branch: master
      fetchcore_ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      solr_url: http://127.0.0.1:8983/solr
      solr_deployment_mode: standalone
      collection: fetchcore-self-dogfood
      create_if_missing: true
      solr_provision_mode: reuse_only
      index_lifecycle: sync
      evaluate: true
      evaluation_modes_json: '["lexical"]'
      evaluation_gate: false
      scenarios_path: dogfood/scenarios/fetchcore-self.yaml
      artifact_retention_days: 30

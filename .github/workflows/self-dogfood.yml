name: FetchCore self dogfood

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fetchcore-self-dogfood-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  self-index:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/repository-index.yml
    with:
      runner_labels_json: '["ubuntu-latest"]'
      target_repository: oalangomes/fetchcore
      target_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      target_branch: ${{ github.head_ref || github.ref_name }}
      fetchcore_ref: ${{ github.event.pull_request.head.sha || github.sha }}
      solr_url: http://127.0.0.1:8983/solr
      solr_deployment_mode: standalone
      collection: fetchcore-self-dogfood
      create_if_missing: true
      solr_provision_mode: provision_if_missing
      index_lifecycle: rebuild
      evaluate: true
      evaluation_modes_json: '["lexical"]'
      evaluation_gate: false
      scenarios_path: dogfood/scenarios/fetchcore-self.yaml
      artifact_retention_days: 14

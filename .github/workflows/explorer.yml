name: Search Lab

on:
  pull_request:
    paths:
      - 'tools/explorer/**'
      - '.github/workflows/explorer.yml'
      - 'src/fetchcore/application/**'
      - 'src/fetchcore/retrieval/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pull pinned Solr image
        shell: bash
        env:
          IMAGE_OVERRIDE: ${{ vars.FETCHCORE_CI_SOLR_IMAGE }}
        run: |
          set -euo pipefail
          source infra/images.lock
          image="${IMAGE_OVERRIDE:-$FETCHCORE_SOLR_IMAGE}"
          scripts/ci/docker-pull.sh "$image"
          echo "FETCHCORE_SOLR_IMAGE=$image" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FetchCore and API extras
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -r tools/explorer/api/requirements.txt
      - name: Python contracts and default Solr selection
        run: python -m pytest -q tools/explorer/api/test_app.py
      - name: Start isolated Solr with FetchCore Projection v3 schema
        run: |
          docker run -d --name fetchcore-explorer-solr \
            -p 127.0.0.1:8983:8983 \
            -v "$GITHUB_WORKSPACE/infra/solr/configset:/fetchcore-configset:ro" \
            "$FETCHCORE_SOLR_IMAGE" solr-precreate fetchcore-lab /fetchcore-configset
      - name: Wait for Solr readiness
        run: |
          python - <<'PY'
          import time
          from urllib.request import urlopen

          url = "http://127.0.0.1:8983/solr/admin/info/system"
          for _ in range(60):
              try:
                  with urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except OSError:
                  time.sleep(2)
          raise SystemExit("Solr did not start")
          PY
      - name: Index real Search Lab fixture in Solr
        env:
          FETCHCORE_INDEX_WORKSPACE: ${{ github.workspace }}/tools/explorer/fixtures/demo-repo
          FETCHCORE_INDEX_REPOSITORY: demo/catalog
          FETCHCORE_INDEX_BACKEND: solr
          FETCHCORE_INDEX_BACKEND_SETTINGS: '{"url":"http://127.0.0.1:8983/solr","collection":"fetchcore-lab","projection_version":"3"}'
        run: |
          fetchcore index bootstrap
          fetchcore index sync
      - name: Install UI dependencies
        working-directory: tools/explorer/web
        run: npm install --no-audit --no-fund
      - name: Build and TypeScript check
        working-directory: tools/explorer/web
        run: npm run build
      - name: UI unit tests
        working-directory: tools/explorer/web
        run: npm test
      - name: Chromium browser
        working-directory: tools/explorer/web
        run: npx playwright install --with-deps chromium
      - name: Full browser smoke, real Solr retrieval and source
        working-directory: tools/explorer/web
        env:
          CI: 'true'
        run: npm run test:e2e
      - name: Stop isolated Solr
        if: ${{ always() }}
        run: docker rm -f fetchcore-explorer-solr >/dev/null 2>&1 || true


  compose-stack:
    name: Docker Compose integrated stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FETCHCORE_SOURCE_PATH: ${{ github.workspace }}/tools/explorer/fixtures/demo-repo
      FETCHCORE_REPOSITORY: demo/catalog
      FETCHCORE_SOLR_COLLECTION: fetchcore-lab
    steps:
      - uses: actions/checkout@v4
      - name: Pull pinned stack images
        shell: bash
        env:
          PYTHON_IMAGE_OVERRIDE: ${{ vars.FETCHCORE_CI_PYTHON_IMAGE }}
          SOLR_IMAGE_OVERRIDE: ${{ vars.FETCHCORE_CI_SOLR_IMAGE }}
        run: |
          set -euo pipefail
          source infra/images.lock
          python_image="${PYTHON_IMAGE_OVERRIDE:-$FETCHCORE_PYTHON_IMAGE}"
          solr_image="${SOLR_IMAGE_OVERRIDE:-$FETCHCORE_SOLR_IMAGE}"
          scripts/ci/docker-pull.sh "$python_image"
          scripts/ci/docker-pull.sh "$solr_image"
          echo "FETCHCORE_PYTHON_IMAGE=$python_image" >> "$GITHUB_ENV"
          echo "FETCHCORE_SOLR_IMAGE=$solr_image" >> "$GITHUB_ENV"
      - name: Validate root, legacy and standalone Compose contracts
        run: |
          docker compose config --quiet
          docker compose --profile runtime --profile indexing config --quiet
          docker compose -f tools/explorer/compose.yaml config --quiet
          docker compose -f infra/compose/solr.yml config --quiet
          docker compose -f infra/compose/opensearch.yml config --quiet
          docker compose -f infra/compose/qdrant.yml config --quiet
          FETCHCORE_BACKEND=opensearch docker compose -f infra/compose/app.yml -f infra/compose/opensearch.yml config --quiet
          FETCHCORE_BACKEND=qdrant-vector docker compose -f infra/compose/app.yml -f infra/compose/qdrant.yml config --quiet
      - name: Build and start root default web, API, MCP and Solr
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Assert Solr starts with an empty index (no automatic indexing)
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen

          url = "http://127.0.0.1:8983/solr/fetchcore-lab/select?q=*:*&rows=0&wt=json"
          with urlopen(url, timeout=10) as response:
              payload = json.load(response)
          assert payload["response"]["numFound"] == 0, payload
          PY
      - name: Confirm healthy process is not an indexed repository
        run: |
          docker compose exec -T api python - <<'PY'
          import json
          from urllib.request import urlopen

          with urlopen("http://127.0.0.1:8765/api/readiness", timeout=10) as response:
              state = json.load(response)
          assert state["schema_version"] == 1, state
          assert state["checks"]["service"]["state"] == "ready", state
          assert state["checks"]["schema"]["state"] == "ready", state
          assert state["checks"]["snapshot"]["state"] == "absent", state
          assert state["ready"] is False, state
          PY
      - name: Explicitly provision and index fixture
        run: |
          docker compose --profile indexing run --rm indexer fetchcore index bootstrap
          docker compose --profile indexing run --rm indexer fetchcore index sync
      - name: Verify post-index readiness facts without implicit writes
        run: |
          docker compose exec -T api python - <<'PY'
          import json
          from urllib.request import urlopen

          with urlopen("http://127.0.0.1:8765/api/readiness", timeout=10) as response:
              state = json.load(response)
          assert state["checks"]["service"]["state"] == "ready", state
          assert state["checks"]["schema"]["state"] == "ready", state
          assert state["checks"]["snapshot"]["state"] == "ready", state
          assert state["indexed_revision"] is not None, state
          # A snapshot can be present even when its runtime revision is unbound.
          assert state["ready"] is False if state["requested_revision"] is None else True
          PY
      - name: Smoke nginx, API, Solr and MCP Streamable HTTP
        run: docker compose exec -T api python -m tools.explorer.docker.smoke
      - name: Confirm persistent Solr index survives a service restart
        run: |
          docker compose restart solr
          docker compose up -d --wait --wait-timeout 180
          docker compose exec -T api python -m tools.explorer.docker.smoke
      - name: Collect Compose diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Tear down isolated test stack
        if: always()
        run: docker compose down -v --remove-orphans

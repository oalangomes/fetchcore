name: Search Lab

on:
  pull_request:
    paths:
      - 'tools/explorer/**'
      - '.github/workflows/explorer.yml'
      - 'src/fetchcore/application/**'
      - 'src/fetchcore/retrieval/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FetchCore and API extras
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -r tools/explorer/api/requirements.txt
      - name: Python contracts and default Solr selection
        run: python -m pytest -q tools/explorer/api/test_app.py
      - name: Start isolated Solr with FetchCore Projection v3 schema
        run: |
          docker run -d --name fetchcore-explorer-solr \
            -p 127.0.0.1:8983:8983 \
            -v "$GITHUB_WORKSPACE/infra/solr/configset:/fetchcore-configset:ro" \
            solr:9.10.1 solr-precreate fetchcore-lab /fetchcore-configset
      - name: Wait for Solr readiness
        run: |
          python - <<'PY'
          import time
          from urllib.request import urlopen

          url = "http://127.0.0.1:8983/solr/admin/info/system"
          for _ in range(60):
              try:
                  with urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except OSError:
                  time.sleep(2)
          raise SystemExit("Solr did not start")
          PY
      - name: Index real Search Lab fixture in Solr
        env:
          FETCHCORE_INDEX_WORKSPACE: ${{ github.workspace }}/tools/explorer/fixtures/demo-repo
          FETCHCORE_INDEX_REPOSITORY: demo/catalog
          FETCHCORE_INDEX_BACKEND: solr
          FETCHCORE_INDEX_BACKEND_SETTINGS: '{"url":"http://127.0.0.1:8983/solr","collection":"fetchcore-lab","projection_version":"3"}'
        run: |
          fetchcore index bootstrap
          fetchcore index sync
      - name: Install UI dependencies
        working-directory: tools/explorer/web
        run: npm install --no-audit --no-fund
      - name: Build and TypeScript check
        working-directory: tools/explorer/web
        run: npm run build
      - name: UI unit tests
        working-directory: tools/explorer/web
        run: npm test
      - name: Chromium browser
        working-directory: tools/explorer/web
        run: npx playwright install --with-deps chromium
      - name: Full browser smoke, real Solr retrieval and source
        working-directory: tools/explorer/web
        env:
          CI: 'true'
        run: npm run test:e2e
      - name: Stop isolated Solr
        if: ${{ always() }}
        run: docker rm -f fetchcore-explorer-solr >/dev/null 2>&1 || true


  compose-stack:
    name: Docker Compose integrated stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FETCHCORE_SOURCE_PATH: ./tools/explorer/fixtures/demo-repo
      FETCHCORE_REPOSITORY: demo/catalog
      FETCHCORE_SOLR_COLLECTION: fetchcore-lab
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start web, API, MCP and Solr
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Assert no automatic indexing on startup
        run: |
          docker compose --profile indexing run --rm indexer fetchcore index status > /tmp/fetchcore-preindex.json
          python - <<'PY'
          import json
          data = json.load(open("/tmp/fetchcore-preindex.json", encoding="utf-8"))
          assert data["result"].get("snapshot") is None or data["result"].get("status") not in ("ready", "current"), data
          PY
      - name: Explicitly provision and index fixture
        run: |
          docker compose --profile indexing run --rm indexer fetchcore index bootstrap
          docker compose --profile indexing run --rm indexer fetchcore index sync
      - name: Smoke nginx, API, Solr and MCP Streamable HTTP
        run: docker compose exec -T api python -m tools.explorer.docker.smoke
      - name: Confirm persistent Solr index survives a service restart
        run: |
          docker compose restart solr
          docker compose exec -T api python -m tools.explorer.docker.smoke
      - name: Collect Compose diagnostics on failure
        if: failure()
        run: docker compose logs --no-color --tail=150
      - name: Tear down isolated test stack
        if: always()
        run: docker compose down -v --remove-orphans

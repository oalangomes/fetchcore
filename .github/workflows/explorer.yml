name: Search Lab

on:
  pull_request:
    paths:
      - 'tools/explorer/**'
      - '.github/workflows/explorer.yml'
      - 'infra/compose/solr.yml'
      - 'infra/images.lock'
      - 'infra/solr/**'
      - 'src/fetchcore/application/**'
      - 'src/fetchcore/operational/solr_runtime.py'
      - 'src/fetchcore/retrieval/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explorer:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Pull pinned Solr image
        shell: bash
        env:
          IMAGE_OVERRIDE: ${{ vars.FETCHCORE_CI_SOLR_IMAGE }}
        run: |
          set -euo pipefail
          source infra/images.lock
          image="${IMAGE_OVERRIDE:-$FETCHCORE_SOLR_IMAGE}"
          scripts/ci/docker-pull.sh "$image"
          echo "FETCHCORE_SOLR_IMAGE=$image" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FetchCore and API extras
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install -r tools/explorer/api/requirements.txt
      - name: Python contracts and default Solr selection
        run: python -m pytest -q tools/explorer/api/test_app.py
      - name: Start isolated Standalone Solr for legacy indexer validation
        run: |
          docker run -d --name fetchcore-explorer-solr \
            -p 127.0.0.1:8983:8983 \
            -v "$GITHUB_WORKSPACE/infra/solr/configset:/fetchcore-configset:ro" \
            "$FETCHCORE_SOLR_IMAGE" solr-precreate fetchcore /fetchcore-configset
      - name: Wait for Standalone Solr readiness
        run: |
          python - <<'PY'
          import time
          from urllib.request import urlopen

          url = "http://127.0.0.1:8983/solr/admin/info/system?wt=json"
          for _ in range(60):
              try:
                  with urlopen(url, timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except OSError:
                  time.sleep(2)
          raise SystemExit("Standalone Solr did not start")
          PY
      - name: Index real Search Lab fixture in Solr
        env:
          FETCHCORE_INDEX_WORKSPACE: ${{ github.workspace }}/tools/explorer/fixtures/demo-repo
          FETCHCORE_INDEX_REPOSITORY: demo/catalog
          FETCHCORE_INDEX_BACKEND: solr
          FETCHCORE_INDEX_BACKEND_SETTINGS: '{"url":"http://127.0.0.1:8983/solr","collection":"fetchcore","projection_version":"3"}'
        run: |
          fetchcore index bootstrap
          fetchcore index sync
      - name: Verify persisted structural lookup against live Solr
        env:
          FETCHCORE_INDEX_WORKSPACE: ${{ github.workspace }}/tools/explorer/fixtures/demo-repo
          FETCHCORE_INDEX_REPOSITORY: demo/catalog
          FETCHCORE_SOLR_URL: http://127.0.0.1:8983/solr
          FETCHCORE_SOLR_COLLECTION: fetchcore
        run: python -m pytest -q tests/integration/test_solr_structural_navigation.py
      - name: Install UI dependencies
        working-directory: tools/explorer/web
        run: npm install --no-audit --no-fund
      - name: Build and TypeScript check
        working-directory: tools/explorer/web
        run: npm run build
      - name: UI unit tests
        working-directory: tools/explorer/web
        run: npm test
      - name: Chromium browser
        working-directory: tools/explorer/web
        run: npx playwright install --with-deps chromium
      - name: Full browser smoke, real Solr retrieval and source
        working-directory: tools/explorer/web
        env:
          CI: 'true'
        run: npm run test:e2e
      - name: Stop isolated Solr
        if: ${{ always() }}
        run: docker rm -f fetchcore-explorer-solr >/dev/null 2>&1 || true


  compose-stack:
    name: Docker Compose integrated benchmark stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FETCHCORE_LOCAL_SOURCE_PATH: ${{ github.workspace }}/tools/explorer/fixtures/demo-repo
      FETCHCORE_REPOSITORY: demo/catalog
    steps:
      - uses: actions/checkout@v4
      - name: Pull pinned stack images
        shell: bash
        env:
          PYTHON_IMAGE_OVERRIDE: ${{ vars.FETCHCORE_CI_PYTHON_IMAGE }}
          SOLR_IMAGE_OVERRIDE: ${{ vars.FETCHCORE_CI_SOLR_IMAGE }}
        run: |
          set -euo pipefail
          source infra/images.lock
          python_image="${PYTHON_IMAGE_OVERRIDE:-$FETCHCORE_PYTHON_IMAGE}"
          solr_image="${SOLR_IMAGE_OVERRIDE:-$FETCHCORE_SOLR_IMAGE}"
          scripts/ci/docker-pull.sh "$python_image"
          scripts/ci/docker-pull.sh "$solr_image"
          echo "FETCHCORE_PYTHON_IMAGE=$python_image" >> "$GITHUB_ENV"
          echo "FETCHCORE_SOLR_IMAGE=$solr_image" >> "$GITHUB_ENV"
      - name: Validate all canonical Compose contracts
        run: |
          python scripts/check_compose_fleet.py
          FETCHCORE_OPERATIONAL_SOURCE_PATH="$GITHUB_WORKSPACE/tools/explorer/fixtures/demo-repo" \
          FETCHCORE_OPERATIONAL_RUNTIME_CONFIG="$GITHUB_WORKSPACE/infra/compose/operational-mcp.runtime.yml" \
            docker compose -f compose.yml config --quiet
          docker compose -f compose.dev.yml config --quiet
          docker compose -f compose.benchmark.yml config --quiet
      - name: Build and start only the disposable BENCHMARK stack
        run: docker compose -f compose.benchmark.yml up -d --build --wait --wait-timeout 180
      - name: Verify SolrCloud has no implicitly provisioned collections
        run: |
          docker compose -f compose.benchmark.yml exec -T api python - <<'PY'
          import json
          from urllib.request import urlopen
          with urlopen("http://solr:8983/solr/admin/info/system?wt=json", timeout=8) as r:
              assert json.load(r)["mode"] == "solrcloud"
          with urlopen("http://solr:8983/solr/admin/collections?action=LIST&wt=json", timeout=8) as r:
              assert json.load(r)["collections"] == []
          with urlopen("http://127.0.0.1:8765/api/config", timeout=8) as r:
              assert r.status == 200
          PY
      - name: Smoke Lab, API and native MCP, without modifying index
        run: |
          curl --noproxy '*' -fsS http://127.0.0.1:48767/ >/dev/null
          curl --noproxy '*' -fsS http://127.0.0.1:48767/api/config >/dev/null
          docker compose -f compose.benchmark.yml exec -T mcp python - <<'PY'
          import socket
          with socket.create_connection(("127.0.0.1", 8766), timeout=8):
              pass
          PY
      - name: Confirm SolrCloud survives a restart without implicit indexing
        run: |
          docker compose -f compose.benchmark.yml restart solr
          docker compose -f compose.benchmark.yml up -d --wait --wait-timeout 180
          docker compose -f compose.benchmark.yml exec -T api python - <<'PY'
          import json
          from urllib.request import urlopen
          with urlopen("http://solr:8983/solr/admin/collections?action=LIST&wt=json", timeout=8) as r:
              assert json.load(r)["collections"] == []
          PY
      - name: Collect benchmark Compose diagnostics on failure
        if: failure()
        run: docker compose -f compose.benchmark.yml logs --no-color --tail=150
      - name: Tear down ONLY the disposable benchmark stack
        if: always()
        run: docker compose -f compose.benchmark.yml down -v --remove-orphans

# Optional explicit Ollama service. No model downloads.
services:
  ollama:
    image: ${FETCHCORE_OLLAMA_IMAGE:?set an explicitly reviewed Ollama image tag or digest}
    labels:
      io.fetchcore.owner: ${FETCHCORE_INFRA_OWNER:?}
    ports:
      - "127.0.0.1:${FETCHCORE_OLLAMA_PORT:?}:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
volumes:
  ollama-data:
    labels:
      io.fetchcore.owner: ${FETCHCORE_INFRA_OWNER:?}

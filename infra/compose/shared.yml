# Explicit opt-in service fleet. Never included by the legacy root Compose.
# Invoke through scripts/shared_infra.py to resolve instance routing.
name: ${FETCHCORE_INFRA_PROJECT:?use shared_infra.py}
x-owned: &owned
  labels:
    io.fetchcore.owner: ${FETCHCORE_INFRA_OWNER:?use shared_infra.py}
services:
  solr:
    <<: *owned
    extends:
      file: solr.yml
      service: solr
    # Configset is installed at startup; logical collections remain explicit.
    command: ["sh", "/fetchcore-start-shared.sh"]
    environment:
      FETCHCORE_SOLR_CREATE_COLLECTION: "false"
    volumes:
      - ../solr/start-shared.sh:/fetchcore-start-shared.sh:ro
  opensearch:
    <<: *owned
    extends:
      file: opensearch.yml
      service: opensearch
  qdrant:
    <<: *owned
    extends:
      file: qdrant.yml
      service: qdrant

volumes:
  solrcloud-data:
    labels:
      io.fetchcore.owner: ${FETCHCORE_INFRA_OWNER:?}
  opensearch-data:
    labels:
      io.fetchcore.owner: ${FETCHCORE_INFRA_OWNER:?}
  qdrant-data:
    labels:
      io.fetchcore.owner: ${FETCHCORE_INFRA_OWNER:?}

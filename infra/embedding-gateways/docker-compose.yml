# Optional local proof only. Never expose these gateway ports beyond localhost.
services:
  litellm:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm:latest}
    command: ["--config", "/app/config.yaml"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY}
    volumes:
      - ./litellm.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:4000:4000"
    restart: unless-stopped

  bifrost:
    image: ${BIFROST_IMAGE:-maximhq/bifrost:v1.4.3}
    environment:
      APP_HOST: "0.0.0.0"
      APP_PORT: "8080"
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY}
      BIFROST_ENCRYPTION_KEY: ${BIFROST_ENCRYPTION_KEY:?Set BIFROST_ENCRYPTION_KEY}
    volumes:
      - ./bifrost.json:/app/data/config.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

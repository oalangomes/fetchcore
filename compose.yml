name: fetchcore

services:
  fetchcore:
    profiles: ["runtime"]
    build:
      context: .
    image: ${FETCHCORE_IMAGE:-fetchcore:dev}
    stdin_open: true
    tty: false
    environment:
      FETCHCORE_MCP_WORKSPACE: /workspace
      FETCHCORE_MCP_REPOSITORY: ${FETCHCORE_MCP_REPOSITORY:-local/repository}
      FETCHCORE_MCP_BACKEND: ${FETCHCORE_MCP_BACKEND:-local-semantic}
      FETCHCORE_MCP_REVISION: ${FETCHCORE_MCP_REVISION:-}
      FETCHCORE_MCP_BACKEND_SETTINGS: ${FETCHCORE_MCP_BACKEND_SETTINGS:-}
      FETCHCORE_MCP_RETRIEVAL: ${FETCHCORE_MCP_RETRIEVAL:-}
      FETCHCORE_MCP_KNOWLEDGE_TYPES: ${FETCHCORE_MCP_KNOWLEDGE_TYPES:-}
      FETCHCORE_MCP_REPOSITORY_PATHS: ${FETCHCORE_MCP_REPOSITORY_PATHS:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    volumes:
      - type: bind
        source: ${FETCHCORE_WORKSPACE:-.}
        target: /workspace
        read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"

  solr:
    profiles: ["solr"]
    image: solr:9.10.1
    command: ["solr-precreate", "${SOLR_COLLECTION:-fetchcore-knowledge}", "/opt/solr/server/solr/configsets/fetchcore"]
    ports:
      - "${SOLR_PORT:-8983}:8983"
    volumes:
      - ./infra/solr/configset:/opt/solr/server/solr/configsets/fetchcore:ro
      - solr-data:/var/solr
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8983/solr/admin/info/system >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  opensearch:
    profiles: ["opensearch"]
    image: opensearchproject/opensearch:3.8.0
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_INITIAL_ADMIN_PASSWORD:-}
      bootstrap.memory_lock: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    ports:
      - "${OPENSEARCH_PORT:-9200}:9200"
      - "${OPENSEARCH_METRICS_PORT:-9600}:9600"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9200/_cluster/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 30s

  qdrant:
    profiles: ["qdrant"]
    image: qdrant/qdrant:v1.19.0
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage

volumes:
  solr-data:
  opensearch-data:
  qdrant-data:

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fetchcore"
version = "0.1.0.dev0"
description = "Backend-neutral repository knowledge and technical code retrieval."
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.11,<3.16"
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
]
dependencies = [
  "click>=8.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = [
  "mcp>=2,<3",
]
dev = [
  "mcp>=2,<3",
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mypy>=1.8",
  "pytest>=7.4",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.8",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[project.scripts]
fetchcore = "fetchcore.cli:main"
fetchcore-mcp = "fetchcore.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"fetchcore.operational" = ["configset/conf/*.xml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "solr_integration: requires the opt-in local Docker Solr service",
  "opensearch_integration: requires the opt-in local Docker OpenSearch service",
  "qdrant_integration: requires the opt-in local Docker Qdrant service",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["TRY004", "I001"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.coverage.run]
branch = true
relative_files = true
source = ["fetchcore"]

[tool.coverage.report]
fail_under = 48
precision = 2
show_missing = true

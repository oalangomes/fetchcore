version: 1

selection:
  include:
    - "tools/explorer/web/src/style.css"
    - "tools/explorer/docker/nginx.conf"
    - ".env.example"
    - "infra/images.lock"
  exclude:
    - "benchmarks/baseline-v1/artifacts/**"
    # Keep generated benchmark runs for reproduction, outside search.
    - "benchmarks/**/artifacts/**"
    - ".fetchcore-dogfood/**"
    - "dogfood/scenarios/**"
    - "**/.env.example"

limits:
  max_files: 2500
  max_file_bytes: 1000000
  max_total_bytes: 64000000

chunking:
  max_lines: 160
  overlap_lines: 20

classification:
  rules:
    - pattern: "dogfood/**"
      knowledge_type: tests

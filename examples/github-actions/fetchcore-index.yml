name: Index repository with FetchCore

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index:
    uses: oalangomes/fetchcore/.github/workflows/repository-index.yml@master
    with:
      # Add a repository-specific label for hard affinity when desired.
      # Example: ["self-hosted","Linux","X64","local-runner","my-project"]
      runner_labels_json: '["self-hosted","Linux","X64"]'
      target_repository: ${{ github.repository }}
      target_ref: ${{ github.sha }}
      target_branch: ${{ github.ref_name }}
      fetchcore_ref: master
      solr_url: ${{ vars.FETCHCORE_SOLR_URL || 'http://127.0.0.1:8983/solr' }}
      solr_deployment_mode: auto
      # This second repository owns a distinct resource. Never share the
      # persistent fetchcore core used by FetchCore itself.
      collection: my-project-knowledge
      create_if_missing: false
      solr_provision_mode: reuse_only
      index_lifecycle: sync

      # Set evaluate=true after adding repository-local dogfood scenarios.
      evaluate: false
      evaluation_modes_json: '["lexical"]'
